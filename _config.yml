# --------------------------------------------------
#  TOP NAVIGATION BAR
#  `external: true` opens the link in a new tab.
# --------------------------------------------------
links:
  - title: Main
    url: /
  - title: Publications
    url: /publications/
  - title: Internships
    url: /internships/
  - title: Awards
    url: /awards/
  - title: Hobbies
    url: /hobbies/
  - title: 中文
    url: /cn/
  # - title: AI4Wellbening
